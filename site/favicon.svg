<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Winnow">
  <rect width="128" height="128" rx="30" fill="#15130F"/>
  <!-- kernels: heavy, fall straight down into a tight column -->
  <g fill="#D9A441">
    <ellipse cx="46" cy="101" rx="14" ry="9.5" transform="rotate(-8 46 101)"/>
    <ellipse cx="46" cy="80" rx="13" ry="9" transform="rotate(-8 46 80)"/>
    <ellipse cx="46" cy="60" rx="12" ry="8.5" transform="rotate(-8 46 60)"/>
  </g>
  <!-- chaff: light, blows up and to the right -->
  <g fill="#F1DDB0">
    <circle cx="73" cy="54" r="5.5" opacity=".95"/>
    <circle cx="87" cy="42" r="4.6" opacity=".7"/>
    <circle cx="98" cy="31" r="3.8" opacity=".5"/>
    <circle cx="107" cy="22" r="3" opacity=".32"/>
  </g>
</svg>
